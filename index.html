<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My GitHub Pages Test</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .card {
      background-color: var(--card-bg);
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    h1 {
      margin-top: 0;
      color: var(--accent);
      font-size: 1.8rem;
    }

    p {
      line-height: 1.6;
      color: #94a3b8;
    }

    button {
      background-color: var(--accent);
      color: #0f172a;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 15px;
    }

    button:hover {
      background-color: var(--accent-hover);
      color: #ffffff;
    }

    #message {
      margin-top: 20px;
      font-weight: 500;
      color: #4ade80;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Hello, GitHub Pages! 🎉</h1>
    <p>If you can see this page, your website is successfully up and running online.</p>
    
    <button id="testBtn">Click Me</button>
    <div id="message"></div>
  </div>

  <script>
    const button = document.getElementById('testBtn');
    const message = document.getElementById('message');

    button.addEventListener('click', () => {
      message.textContent = "Awesome! JavaScript is working properly.";
    });
  </script>

</body>
</html>
